<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSI Engine Overhaul Report</title>
<style>
  body { margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; background: #0F1A24; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .loader { text-align: center; padding: 3rem; }
  .spinner { width: 48px; height: 48px; border: 4px solid rgba(217,119,6,0.3); border-top-color: #D97706; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1.5rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader-title { font-size: 20px; font-weight: 700; color: white; margin-bottom: .5rem; }
  .loader-sub { font-size: 13px; color: rgba(255,255,255,0.5); }
  .error { background: #FEF2F2; color: #991B1B; border: 1px solid #FECACA; border-radius: 10px; padding: 1.5rem 2rem; max-width: 500px; text-align: center; }
  .error h2 { font-size: 16px; font-weight: 700; margin-bottom: .5rem; }
  .error p { font-size: 13px; line-height: 1.6; }
</style>
</head>
<body>
<div class="loader" id="loader">
  <div class="spinner"></div>
  <div class="loader-title">Loading Report...</div>
  <div class="loader-sub" id="loader-sub">Fetching from TSI servers</div>
</div>

<script>
const SUPABASE_URL = 'https://skbdamrynkzxdfjhmawj.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrYmRhbXJ5bmt6eGRmamhtYXdqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzODU5MjAsImV4cCI6MjA5MTk2MTkyMH0.JSIr-FKc-u3vqEhFdDNVt_9Y_tKiRCSAguDM7H0LSOQ';

async function loadReport() {
  const params = new URLSearchParams(window.location.search);
  const jobId = params.get('job');

  if (!jobId) {
    showError('No report specified', 'This link is missing the job number. Please use the link provided by TSI.');
    return;
  }

  document.getElementById('loader-sub').textContent = 'Loading report for ' + jobId + '...';

  try {
    const res = await fetch(
      SUPABASE_URL + '/rest/v1/overhaul_data?job_id=eq.' + encodeURIComponent(jobId) + '&field_id=eq.report_html&select=field_value',
      {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY
        }
      }
    );

    if (!res.ok) throw new Error('Server error: ' + res.status);

    const data = await res.json();

    if (!data || !data.length || !data[0].field_value) {
      showError('Report not found', 'No report has been published for job <strong>' + jobId + '</strong> yet. Please contact TSI to request the report link.');
      return;
    }

    const html = data[0].field_value;

    // Replace the current page content with the report HTML
    document.open();
    document.write(html);
    document.close();

  } catch (err) {
    showError('Could not load report', 'Error: ' + err.message + '<br><br>Please check your internet connection and try again, or contact TSI for assistance.');
  }
}

function showError(title, message) {
  document.getElementById('loader').innerHTML =
    '<div class="error"><h2>' + title + '</h2><p>' + message + '</p></div>';
}

loadReport();
</script>
</body>
</html>
