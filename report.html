<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSI Engine Overhaul Report</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0F1A24; }

  /* ── TOP BAR ── */
  #top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
    background: linear-gradient(135deg, #1A3A5C, #1E4D7B);
    padding: .6rem 1.25rem;
    display: flex; align-items: center; justify-content: space-between; gap: .75rem;
    box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    flex-wrap: wrap;
  }
  #top-bar .job-label {
    color: rgba(255,255,255,0.7); font-size: 12px; font-weight: 600;
    letter-spacing: .3px; white-space: nowrap;
  }
  #top-bar .job-label strong { color: white; }
  .bar-actions { display: flex; gap: .5rem; flex-shrink: 0; }
  .bar-btn {
    background: #D97706; color: #1A3A5C; border: none; border-radius: 6px;
    padding: .4rem 1rem; font-size: 12px; font-weight: 700; cursor: pointer;
    font-family: inherit; display: flex; align-items: center; gap: 4px;
    transition: background .15s;
  }
  .bar-btn:hover { background: #F59E0B; }
  .bar-btn.secondary {
    background: rgba(255,255,255,0.12); color: white;
    border: 1px solid rgba(255,255,255,0.25);
  }
  .bar-btn.secondary:hover { background: rgba(255,255,255,0.2); }

  /* ── LOADING STATE ── */
  #loader {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; flex-direction: column; gap: 1rem; padding: 2rem;
  }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid rgba(217,119,6,0.3);
    border-top-color: #D97706;
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader-title { font-size: 18px; font-weight: 700; color: white; }
  .loader-sub { font-size: 13px; color: rgba(255,255,255,0.5); }

  /* ── ERROR STATE ── */
  #error-box {
    display: none; align-items: center; justify-content: center;
    min-height: 100vh; padding: 2rem;
  }
  .error-card {
    background: #FEF2F2; color: #991B1B;
    border: 1px solid #FECACA; border-radius: 12px;
    padding: 1.5rem 2rem; max-width: 480px; text-align: center;
  }
  .error-card h2 { font-size: 16px; font-weight: 700; margin-bottom: .5rem; }
  .error-card p { font-size: 13px; line-height: 1.6; }

  /* ── IFRAME ── */
  #report-frame {
    display: none;
    position: fixed;
    top: 48px; left: 0; right: 0; bottom: 0;
    width: 100%; height: calc(100vh - 48px);
    border: none;
  }
</style>
</head>
<body>

<!-- Top bar (hidden until report loads) -->
<div id="top-bar" style="display:none;">
  <div class="job-label">TSI Engine Overhaul Report &mdash; <strong id="bar-job-id"></strong></div>
  <div class="bar-actions">
    <button class="bar-btn" onclick="downloadReport()">⬇ Download Report</button>
    <button class="bar-btn secondary" onclick="printReport()">🖨 Print</button>
  </div>
</div>

<!-- Loading state -->
<div id="loader">
  <div class="spinner"></div>
  <div class="loader-title">Loading Report...</div>
  <div class="loader-sub" id="loader-sub">Fetching from TSI servers</div>
</div>

<!-- Error state -->
<div id="error-box">
  <div class="error-card">
    <h2 id="err-title">Report Not Found</h2>
    <p id="err-msg">No report found for this link.</p>
  </div>
</div>

<!-- Report iframe -->
<iframe id="report-frame" title="TSI Overhaul Report"></iframe>

<script>
const WORKER_URL = 'https://tsi-overhaul-api.jason-184.workers.dev';

let _reportHtml = '';
let _jobId = '';

async function loadReport() {
  const params = new URLSearchParams(window.location.search);
  const jobId = params.get('job');

  if (!jobId) {
    showError('No Report Specified', 'This link is missing the job number. Please use the link provided by TSI.');
    return;
  }

  _jobId = jobId;
  document.getElementById('loader-sub').textContent = 'Loading ' + jobId + '...';
  document.title = 'TSI Report — ' + jobId;

  try {
    // Fetch the published report from the Cloudflare Worker (same backend as the
    // checklist). The Worker returns an array of { field_id, field_value } rows;
    // we want the row whose field_id is 'report_html'.
    const res = await fetch(
      WORKER_URL + '/api/job/' + encodeURIComponent(jobId),
      { method: 'GET', headers: { 'Content-Type': 'application/json' } }
    );

    if (!res.ok) throw new Error('Server error ' + res.status);

    const rows = await res.json();
    const reportRow = Array.isArray(rows)
      ? rows.find(r => r.field_id === 'report_html')
      : null;

    if (!reportRow || !reportRow.field_value) {
      showError('Report Not Published Yet',
        'No report has been published for job <strong>' + jobId + '</strong>.<br><br>' +
        'Please contact TSI Industries to request the report link.');
      return;
    }

    _reportHtml = reportRow.field_value;

    // The typed summary is stored as its own 'summary' row on the job, in the SAME response
    // we just fetched — it was never lost, only omitted from older published blobs.
    // See patchSummaryBox() for why we need it here.
    const summaryRow = Array.isArray(rows)
      ? rows.find(r => r.field_id === 'summary')
      : null;
    const summaryText = summaryRow && typeof summaryRow.field_value === 'string'
      ? summaryRow.field_value
      : '';

    // Render the report in the iframe using a blob URL
    const blob = new Blob([_reportHtml], { type: 'text/html;charset=utf-8' });
    const blobUrl = URL.createObjectURL(blob);
    const frame = document.getElementById('report-frame');
    frame.src = blobUrl;
    frame.onload = function() {
      URL.revokeObjectURL(blobUrl);
      patchSummaryBox(frame, summaryText);
    };

    // Show the top bar and iframe, hide loader
    document.getElementById('bar-job-id').textContent = jobId;
    document.getElementById('top-bar').style.display = 'flex';
    document.getElementById('loader').style.display = 'none';
    frame.style.display = 'block';

  } catch (err) {
    showError('Could Not Load Report',
      'Error: ' + err.message + '<br><br>' +
      'Please check your internet connection and try again, or contact TSI for assistance.');
  }
}

/**
 * Viewer-side safety net for reports published before the publisher bug was fixed.
 *
 * Those blobs baked the summary box with an EMPTY text div, plus two editor-only leftovers:
 * the "…automatically pulled in below. Click Refresh Notes…" instruction line, and the
 * now-empty Refresh/Clear button wrapper. The typed summary itself was never lost — it is
 * saved as its own 'summary' row on the job — so the rendered report can be repaired
 * without republishing it.
 *
 * Safe on correctly-published reports: the text div is filled ONLY when it is empty, so a
 * baked-in summary is never overwritten or duplicated.
 *
 * The iframe holds a blob: URL created by this page, so it is same-origin and
 * contentDocument is readable. Revoking that URL does not affect the already-parsed
 * document, which is why this reads the DOM instead of re-fetching the blob.
 *
 * Fails silently by design: a report that renders without its summary still beats a report
 * that does not render at all.
 */
function patchSummaryBox(frame, summaryText) {
  try {
    const doc = frame.contentDocument;
    if (!doc) return;
    const box = doc.querySelector('.ai-summary-box');
    if (!box) return;

    let target = null;
    Array.prototype.slice.call(box.children).forEach(function (d) {
      if (d.tagName !== 'DIV') return;
      if (d.classList.contains('ai-badge')) return;                  // keep: the heading
      const style = d.getAttribute('style') || '';
      if (/white-space\s*:\s*pre-wrap/i.test(style)) { target = d; return; }  // the summary
      if (d.textContent.indexOf('automatically pulled') !== -1) { d.remove(); return; }
      if (/display\s*:\s*flex/i.test(style) && !d.textContent.trim()) d.remove();
    });

    // Fill only if empty — never clobber a correctly-baked summary.
    if (target && !target.textContent.trim() && summaryText.trim()) {
      target.textContent = summaryText;
    }
  } catch (e) {
    console.warn('Summary repair skipped:', e);
  }
}

function showError(title, msg) {
  document.getElementById('loader').style.display = 'none';
  document.getElementById('err-title').textContent = title;
  document.getElementById('err-msg').innerHTML = msg;
  document.getElementById('error-box').style.display = 'flex';
}

function downloadReport() {
  if (!_reportHtml) return;
  // Serialize the PATCHED document when it is available, so a downloaded copy carries the
  // repaired summary rather than the original empty box. Photos are already data: URIs, so
  // they survive serialization. Falls back to the raw blob if the frame can't be read.
  let html = _reportHtml;
  try {
    const doc = document.getElementById('report-frame').contentDocument;
    if (doc && doc.documentElement) html = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
  } catch (e) { /* fall back to the raw published blob */ }
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'TSI-' + _jobId + '-Overhaul-Report.html';
  document.body.appendChild(a);
  a.click();
  setTimeout(function() { URL.revokeObjectURL(url); a.remove(); }, 1000);
}

function printReport() {
  const frame = document.getElementById('report-frame');
  if (frame && frame.contentWindow) {
    frame.contentWindow.print();
  }
}

loadReport();
</script>
</body>
</html>
