<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TSI • Shared work orders</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.mjs"></script></head><body><header><strong>TSI <span>WORK ORDERS</span></strong><p>Protected development environment • release disabled</p></header><main><p id="identity">Checking your session…</p><form id="open"><label>Work order<input id="job" required maxlength="160" autocomplete="off"></label><button>Open / refresh</button></form><p id="status" role="status" aria-live="polite"></p><section><h1>Shared evidence</h1><p>Saved records synchronize under your signed-in identity. No manual procedures are bundled.</p><form id="record"><label>Type<select id="type"><option value="measurement">Measurement</option><option value="part">Part</option><option value="nonconformance">Nonconformance</option></select></label><label>Component<input id="component" required maxlength="200"></label><label>Evidence JSON<textarea id="payload" rows="5" required placeholder='{"field_id":"inspection","value":"1","units":"mm","phase":"inspection"}'></textarea></label><button>Save evidence</button></form><button id="sync">Synchronize pending evidence</button><p id="queue"></p><h2>Evidence history</h2><div id="events"></div></section><section><h2>Independent review</h2><form id="approval"><label>Original event ID<input id="event" required></label><label>Disposition<input id="disposition" required maxlength="200"></label><label>Review evidence<input id="evidence" required maxlength="200"></label><button>Submit review</button></form></section><section><h2>Operation state</h2><form id="state"><label>Operation ID<input id="step" required pattern="P[0-9]{2}-[0-9]{2}" placeholder="P01-01"></label><label>Status<select id="operation-status"><option>pending</option><option>in_progress</option><option>blocked</option></select></label><button>Update with current revision</button></form><pre id="states"></pre></section><section><h2>Reports</h2><button id="internal">Internal review report</button><button id="customer">Customer disclosure preview</button><pre id="report"></pre></section></main></body></html>
